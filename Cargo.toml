[package]
name = "scryde_encdec"
version = "1.0.2"
edition = "2024"
authors = ["kerogenesis"]
description = "Scryde Gamekit Data encrypter & decrypter"

[dependencies]
flate2 = { version = "1.1", features = ["zlib"] }
blowfish = "0.10"
crc32fast = "1"
cipher = "0.5"
byteorder = "1.5"
num-bigint = "0.5"
indicatif = "0.18"
crossterm = "0.29"
rayon = "1.10"
walkdir = "2"
camino = "1"
obfstr = "0.4"

[build-dependencies]
winres = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
debug = false
